        "404":
          description: Không tìm thấy
      tags:
        - users
        - "{id}"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
            example:
              name: string
              email: string
              phone: string
    delete:
      summary: Xóa bản ghi theo ID khỏi bảng Users
      responses:
        "200":
          description: Xóa thành công
        "404":
