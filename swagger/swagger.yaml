                  type: integer
                ma_nguoi_thue:
                  type: integer
                ngay_thue:
                  type: string
                hoan_thanh:
                  type: boolean
            example:
              ma_cong_viec: 176
              ma_nguoi_thue: 7534
              ngay_thue: string
              hoan_thanh: true
  /users/{id}:
    get:
