openapi: 3.0.0
info:
  title: Fiverr Node.js API thuần - Full Tables
  version: 1.0.0
  description: Hệ thống quản lý đầy đủ 6 bảng dữ liệu Fiverr tự động đồng bộ
servers:
  - url: /
paths:
  /init-data:
    get:
      summary: Tự động chạy code thêm 3 bình luận và thêm 1 loại công việc mới
      responses:
        "200":
          description: Khởi tạo dữ liệu thành công
      tags:
        - init-data
  /binh-luan/{id}:
    get:
      summary: Lấy chi tiết bản ghi theo ID từ bảng Bình Luận
      responses:
        "200":
          description: Thành công
        "404":
          description: Không tìm thấy
      tags:
        - binh-luan
        - "{id}"
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 2076
    put:
      summary: Cập nhật bản ghi theo ID trong bảng Bình Luận
      responses:
        "200":
          description: Cập nhật thành công
        "404":
          description: Không tìm thấy
      tags:
        - binh-luan
        - "{id}"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                noi_dung:
                  type: string
                sao_binh_luan:
                  type: integer
            example:
              noi_dung: string
              sao_binh_luan: 9067
    delete:
      summary: Xóa bản ghi theo ID khỏi bảng Bình Luận
      responses:
        "200":
          description: Xóa thành công
        "404":
          description: Không tìm thấy
      tags:
        - binh-luan
        - "{id}"
  /binh-luan:
    get:
      summary: Lấy danh sách dữ liệu từ bảng Bình Luận
      responses:
        "200":
          description: Thành công
      tags:
        - binh-luan
    post:
      summary: Thêm bản ghi mới vào bảng Bình Luận
      responses:
        "201":
          description: Tạo mới thành công
      tags:
        - binh-luan
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ma_cong_viec:
                  type: integer
                ma_nguoi_binh_luan:
                  type: integer
                ngay_binh_luan:
                  type: string
                noi_dung:
                  type: string
                sao_binh_luan:
                  type: integer
            example:
              ma_cong_viec: 8510
              ma_nguoi_binh_luan: 1939
              ngay_binh_luan: string
              noi_dung: string
              sao_binh_luan: 4750
  /chi-tiet-loai-cong-viec/{id}:
