        - "{id}"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ten_chi_tiet:
                  type: string
                hinh_anh:
                  type: string
            example:
              ten_chi_tiet: string
              hinh_anh: string
    delete:
      summary: Xóa bản ghi theo ID khỏi bảng Chi Tiết Loại Công Việc
      responses:
        "200":
          description: Xóa thành công
        "404":
          description: Không tìm thấy
      tags:
        - chi-tiet-loai-cong-viec
        - "{id}"
  /chi-tiet-loai-cong-viec:
    get:
      summary: Lấy danh sách dữ liệu từ bảng Chi Tiết Loại Công Việc
      responses:
        "200":
          description: Thành công
      tags:
        - chi-tiet-loai-cong-viec
    post:
      summary: Thêm bản ghi mới vào bảng Chi Tiết Loại Công Việc
      responses:
        "201":
          description: Tạo mới thành công
      tags:
        - chi-tiet-loai-cong-viec
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ten_chi_tiet:
                  type: string
                hinh_anh:
                  type: string
                ma_loai_cong_viec:
                  type: integer
            example:
              ten_chi_tiet: string
              hinh_anh: string
              ma_loai_cong_viec: 2132
  /cong-viec/{id}:
    get:
      summary: Lấy chi tiết bản ghi theo ID từ bảng Công Việc
      responses:
        "200":
          description: Thành công
        "404":
          description: Không tìm thấy
      tags:
        - cong-viec
        - "{id}"
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 2076
    put:
      summary: Cập nhật bản ghi theo ID trong bảng Công Việc
      responses:
        "200":
          description: Cập nhật thành công
        "404":
          description: Không tìm thấy
      tags:
        - cong-viec
        - "{id}"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ten_cong_viec:
                  type: string
                gia_tien:
                  type: integer
                mo_ta:
                  type: string
            example:
              ten_cong_viec: string
              gia_tien: 8791
              mo_ta: string
    delete:
      summary: Xóa bản ghi theo ID khỏi bảng Công Việc
      responses:
        "200":
          description: Xóa thành công
        "404":
          description: Không tìm thấy
      tags:
        - cong-viec
        - "{id}"
  /cong-viec:
    get:
      summary: Lấy danh sách dữ liệu từ bảng Công Việc
      responses:
        "200":
          description: Thành công
      tags:
        - cong-viec
    post:
      summary: Thêm bản ghi mới vào bảng Công Việc
      responses:
        "201":
          description: Tạo mới thành công
      tags:
        - cong-viec
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ten_cong_viec:
                  type: string
                danh_gia:
                  type: integer
                gia_tien:
                  type: integer
                hinh_anh:
                  type: string
                mo_ta:
                  type: string
                ma_chi_tiet_loai:
                  type: integer
                sao_cong_viec:
                  type: integer
            example:
              ten_cong_viec: string
              danh_gia: 6614
              gia_tien: 9155
              hinh_anh: string
              mo_ta: string
              ma_chi_tiet_loai: 1431
              sao_cong_viec: 6796
  /loai-cong-viec/{id}:
    get:
      summary: Lấy chi tiết bản ghi theo ID từ bảng Loại Công Việc
      responses:
