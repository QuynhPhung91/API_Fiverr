      summary: Lấy chi tiết bản ghi theo ID từ bảng Chi Tiết Loại Công Việc
      responses:
        "200":
          description: Thành công
        "404":
          description: Không tìm thấy
      tags:
        - chi-tiet-loai-cong-viec
        - "{id}"
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 2076
    put:
      summary: Cập nhật bản ghi theo ID trong bảng Chi Tiết Loại Công Việc
      responses:
