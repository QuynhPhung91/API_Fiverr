<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Fiverr API Documentation</title>
    <!-- Nhúng thư viện giao diện Swagger từ nguồn CDN công khai -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com" />
    <style>
      html {
        box-sizing: border-box;
        overflow-y: scroll;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <!-- Nơi giao diện đồ họa API sẽ tự động dựng lên -->
    <div id="swagger-ui"></div>

    <!-- Nhúng các file script cốt lõi của Swagger -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>

    <script>
      window.onload = function () {
        window.ui = SwaggerUIBundle({
          url: "./swagger/swagger.yaml", // thêm link trỏ thư mục vào TM swagger.
          dom_id: "#swagger-ui",
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: "StandaloneLayout",
        });
      };
    </script>
  </body>
</html>
