<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fiverr Node.js API Docs</title>
    <!-- Trỏ trực tiếp vào tệp tĩnh nội bộ của thư viện -->
    <link rel="stylesheet" type="text/css" href="/swagger-ui.css" />
    <style>
      html {
        box-sizing: border-box;
        overflow: -webkit-scrollbars;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>

    <!-- Nạp trực tiếp bộ script core từ thư viện nội bộ -->
    <script src="/swagger-ui-bundle.js"></script>
    <script src="/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = function () {
        window.ui = SwaggerUIBundle({
          url: "/swagger.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout",
        });
      };
    </script>
  </body>
</html>
